server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Restrict dedicated vault workers to same-origin scripts, without fetch.
    # Explicit module MIME types work with the pinned nginx image as well.
    location /security/ {
        types { application/javascript js mjs; }
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; connect-src 'none'" always;
        try_files $uri =404;
    }

    # Authorization codes must not appear in request access logs.
    location = /api/upstream-oauth/callback {
        access_log off;
        proxy_pass http://server:8787;
        add_header Cache-Control "no-store" always;
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://server:8787;
        add_header Cache-Control "no-store" always;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
    }

    location / {
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ /index.html;
    }
}
