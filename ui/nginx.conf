server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Restrict dedicated vault workers to same-origin scripts, without fetch.
    # Explicit module MIME types work with the pinned nginx image as well.
    location /security/ {
        types { application/javascript js mjs; }
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; connect-src 'none'" always;
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://server:8787;
        add_header Cache-Control "no-store" always;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
    }

    # Console pages: same-origin scripts, styles and API calls only. The owner
    # browser flows in ui/tests/owner-fixture.mjs run under this exact policy.
    location / {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
        try_files $uri $uri/ /index.html;
    }
}
