# The HTTPS server, enabled by compose.tls.yaml, which mounts this file into
# conf.d and the certificate into /etc/nginx/tls. The owner vault routes need
# it: the gateway refuses them over plain HTTP.
server {
    listen 443 ssl;
    http2 on;
    server_name _;
    ssl_certificate /etc/nginx/tls/cert.pem;
    ssl_certificate_key /etc/nginx/tls/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    include /etc/nginx/mcpwarden/locations.conf;
}
