# In the container. compose.yaml publishes it on 127.0.0.1 only; the ui
# container reaches it over the Compose network.
listen: 0.0.0.0:8787
downstream_auth:
  bearer_token_env: MCPWARDEN_TOKEN

# Config upstreams are served to every account. Add stdio or HTTP upstreams
# here; the gateway stays up with an empty list.
upstreams: []

policy:
  default: allow

# The catalog, tool-call history and the owner vault. The data volume holds
# the SQLite file.
storage:
  driver: sqlite
  path: /data/mcpwarden.db
  key_env: MCPWARDEN_CREDENTIAL_KEY

# Panel accounts. Set allow_registration to false and restart once your own
# account exists.
accounts:
  allow_registration: true

# Vault and access windows. The owner routes need HTTPS: start with
# compose.tls.yaml, which pins the ui container at this address. Over plain
# HTTP the panel works but the vault stays closed.
owner_security:
  trusted_proxies: ["172.30.87.2/32"]
