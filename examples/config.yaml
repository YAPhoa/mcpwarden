listen: 127.0.0.1:8787
# Required when listen is not loopback. The variable must be set at startup.
# downstream_auth:
#   bearer_token_env: MCPWARDEN_TOKEN
# allowed_origins: ["https://console.example.com"]
# For ChatGPT OAuth, see examples/oauth-config.yaml. OAuth protects /mcp;
# downstream_auth still protects the admin API.

upstreams:
  - name: fs
    transport: stdio
    command: npx
    args: ["-y", "@modelcontextprotocol/server-filesystem", "/tmp/sandbox"]
    env:
      SOME_VAR: ${SOME_VAR}
    call_timeout: 30s

  - name: remote
    transport: http
    url: https://example.com/mcp
    headers:
      Authorization: "Bearer ${REMOTE_TOKEN}"
    call_timeout: 60s

policy:
  default: allow
  rules:
    - match: "fs__write_*"
      action: deny
    - match: "remote__*"
      action: allow

# The catalog, tool-call history and the owner vault live in one SQLite file
# (the default) or PostgreSQL database (docs/storage.md). Without this
# section the gateway uses SQLite at /data/mcpwarden.db, the container path. The
# gateway refuses to start if the database is unavailable and stops if it is
# lost. --stdio needs SQLite, and cannot share the file with a running
# gateway: give each its own path, or connect the client over HTTP.
storage:
  driver: sqlite            # sqlite (default) or postgres
  path: ./mcpwarden.db      # sqlite only; a local filesystem, not a network share
  # database_url_env: MCPWARDEN_DATABASE_URL  # postgres only: the runtime role DSN
  key_env: MCPWARDEN_CREDENTIAL_KEY

# Optional local panel accounts (incompatible with oauth). Config upstreams
# are served to every account, so close registration once yours exists:
# accounts:
#   allow_registration: true

# Optional owner security API (requires accounts). Adds vault,
# access-request, approval and lease routes. Personal connectors with
# credentials (bearer, API key, custom headers) need it: their credentials
# live only in the owner's vault and each call runs inside an owner-activated
# access window. Without it, only connectors without authentication can be
# added.
# owner_security:
#   # Trust only the immediate proxy's IP/CIDR. It must overwrite
#   # X-Forwarded-Proto with the verified client scheme, not forward user input.
#   trusted_proxies: ["127.0.0.1/32", "::1/128"]
#   # Optional direct loopback HTTP for development only; default false.
#   allow_insecure_loopback: false
