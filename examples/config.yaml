listen: 127.0.0.1:8787
# Required when listen is not loopback. The variable must be set at startup.
# downstream_auth:
#   bearer_token_env: MCPWARDEN_TOKEN
# allowed_origins: ["https://console.example.com"]
# For ChatGPT OAuth, see examples/oauth-config.yaml. OAuth protects /mcp;
# downstream_auth still protects the admin API.

upstreams:
  - name: fs
    transport: stdio
    command: npx
    args: ["-y", "@modelcontextprotocol/server-filesystem", "/tmp/sandbox"]
    env:
      SOME_VAR: ${SOME_VAR}
    call_timeout: 30s

  - name: remote
    transport: http
    url: https://example.com/mcp
    headers:
      Authorization: "Bearer ${REMOTE_TOKEN}"
    call_timeout: 60s

policy:
  default: allow
  rules:
    - match: "fs__write_*"
      action: deny
    - match: "remote__*"
      action: allow

audit:
  path: ./audit.jsonl # Persistent file required: admission is synced before dispatch.

# Optional user-registered remote upstreams, stored encrypted:
# managed_upstreams:
#   path: ./managed-upstreams.enc
#   key_env: MCPWARDEN_CREDENTIAL_KEY
#   # file (default) or postgres. postgres requires owner_security and a
#   # completed catalog import and cutover (docs/catalog-migration.md); the
#   # gateway then never reads the file and refuses to start if PostgreSQL is
#   # unavailable or not cut over.
#   backend: file

# Optional local panel accounts (requires managed_upstreams, incompatible with oauth):
# accounts:
#   allow_registration: true

# Optional owner security API (requires accounts). Adds vault, access-request,
# approval and lease routes backed by PostgreSQL schema v4 (migrate first with
# cmd/mcpwarden-security-db). Personal connectors with credentials (bearer,
# API key, custom headers) need it: their credentials live only in the owner's
# vault and each call runs inside an owner-activated access window. Without it,
# only connectors without authentication can be added.
# owner_security:
#   database_url_env: MCPWARDEN_SECURITY_DATABASE_URL
#   # Trust only the immediate proxy's IP/CIDR. It must overwrite
#   # X-Forwarded-Proto with the verified client scheme, not forward user input.
#   trusted_proxies: ["127.0.0.1/32", "::1/128"]
#   # Optional direct loopback HTTP for development only; default false.
#   allow_insecure_loopback: false
