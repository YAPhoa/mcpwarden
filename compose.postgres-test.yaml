# Isolated integration-test database. Credentials are public test fixtures.
# Never attach the application data volume or production configuration here.
services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: mcpwarden_migrator
      POSTGRES_PASSWORD: mcpwarden-test-only
      POSTGRES_DB: mcpwarden_security_test
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_security_test:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcpwarden_migrator -d mcpwarden_security_test"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  postgres_security_test:
